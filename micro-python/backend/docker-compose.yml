services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    command:
      - /bin/sh
      - -ec
      - |
        cat >/mosquitto/config/mosquitto.conf <<'EOF'
        listener 1883 0.0.0.0
        allow_anonymous true
        persistence true
        persistence_location /mosquitto/data/
        EOF
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "0.0.0.0:1883:1883"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mosquitto-data:/mosquitto/data
    networks:
      - backend-net

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    env_file:
      - stack.env
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - backend-net

  telegraf:
    image: telegraf:1.29
    env_file:
      - stack.env
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cat >/etc/telegraf/telegraf.conf <<'EOF'
        [agent]
          interval = "10s"
          round_interval = true
          metric_batch_size = 1000
          metric_buffer_limit = 10000
          collection_jitter = "0s"
          flush_interval = "10s"
          flush_jitter = "0s"
          precision = ""
          debug = true

        [[inputs.mqtt_consumer]]
          servers = ["tcp://mosquitto:1883"]
          topics = ["sensors/#"]
          data_format = "json"

        [[outputs.influxdb_v2]]
          urls = ["http://influxdb:8086"]
          token = "$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN"
          organization = "zour_dough"
          bucket = "sensors"
        EOF
        exec telegraf --config /etc/telegraf/telegraf.conf
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    networks:
      - backend-net
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        mkdir -p /etc/grafana/provisioning/dashboards
        mkdir -p /etc/grafana/provisioning/alerting
        mkdir -p /var/lib/grafana/dashboards

        cat >/etc/grafana/provisioning/datasources/influxdb.yml <<'EOF'
        apiVersion: 1

        datasources:
          - name: InfluxDB
            type: influxdb
            uid: P1809F7CD0C757532
            access: proxy
            url: http://influxdb:8086
            user: ${DOCKER_INFLUXDB_INIT_USERNAME}
            secureJsonData:
              token: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
            jsonData:
              version: Flux
              organization: ${DOCKER_INFLUXDB_INIT_ORG}
              defaultBucket: ${DOCKER_INFLUXDB_INIT_BUCKET}
        EOF

        cat >/etc/grafana/provisioning/dashboards/default.yml <<'EOF'
        apiVersion: 1

        providers:
          - name: Default
            type: file
            options:
              path: /var/lib/grafana/dashboards
        EOF

        cat >/etc/grafana/provisioning/alerting/alert_rules.yml <<'EOF'
        apiVersion: 1
        groups:
          - orgId: 1
            name: "Temperature Monitoring"
            folder: "Alerts"
            interval: 1m
            rules:
              - uid: temp_high_alert
                title: "High Temperature Warning (>30°C)"
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: "P1809F7CD0C757532"
                    model:
                      refId: A
                      query: |
                        from(bucket: "${DOCKER_INFLUXDB_INIT_BUCKET}")
                          |> range(start: -5m)
                          |> filter(fn: (r) => r["_measurement"] == "mqtt_consumer")
                          |> filter(fn: (r) => r["_field"] == "temperature")
                          |> last()
                  - refId: B
                    datasourceUid: "__expr__"
                    model:
                      conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params: []
                          reducer:
                            params: []
                            type: last
                      expression: A
                      type: reduce
                  - refId: C
                    datasourceUid: "__expr__"
                    model:
                      conditions:
                        - evaluator:
                            params: [30]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: ["C"]
                          reducer:
                            params: []
                            type: last
                      expression: B
                      type: threshold
                noDataState: OK
                execErrState: Error
                for: 1m
                annotations:
                  summary: "Temperature is too high! Current value: {{ $$values.B.Value }}°C"
                  description: "The temperature sensor reports a value above 30°C."
                labels:
                  severity: critical
        EOF

        cat >/etc/grafana/provisioning/alerting/contact_points.yml <<'EOF'
        apiVersion: 1

        contactPoints:
          - orgId: 1
            name: "General Alerts"
            receivers:
              - uid: "email-receiver"
                type: email
                settings:
                  addresses: "user@example.com"
                  singleEmail: true
              - uid: "discord-receiver"
                type: discord
                disableResolveMessage: false
                settings:
                  url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL_HERE"
        EOF

        cat >/etc/grafana/provisioning/alerting/notification_policies.yml <<'EOF'
        apiVersion: 1

        policies:
          - orgId: 1
            receiver: "General Alerts"
            group_by: ["grafana_folder", "alertname"]
        EOF

        cat >/var/lib/grafana/dashboards/main.json <<'EOF'
        {
          "annotations": {
            "list": [
              {
                "builtIn": 1,
                "datasource": {
                  "type": "grafana",
                  "uid": "-- Grafana --"
                },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "type": "dashboard"
              }
            ]
          },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "id": null,
          "links": [],
          "liveNow": false,
          "panels": [
            {
              "datasource": {
                "type": "influxdb",
                "uid": "P1809F7CD0C757532"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "#EAB839",
                        "value": 25
                      },
                      {
                        "color": "red",
                        "value": 30
                      }
                    ]
                  },
                  "unit": "celsius"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 0,
                "y": 0
              },
              "id": 1,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "pluginVersion": "10.0.0",
              "targets": [
                {
                  "datasource": {
                    "type": "influxdb",
                    "uid": "P1809F7CD0C757532"
                  },
                  "query": "from(bucket: \"$${bucket}\")\n  |> range(start: -5m)\n  |> filter(fn: (r) => r[\"_measurement\"] == \"mqtt_consumer\")\n  |> filter(fn: (r) => r[\"_field\"] == \"temperature\")\n  |> last()",
                  "refId": "A"
                }
              ],
              "title": "Current Temperature",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "influxdb",
                "uid": "P1809F7CD0C757532"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "gradientMode": "none",
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "pointSize": 5,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "showPoints": "auto",
                    "spanNulls": false,
                    "stacking": {
                      "group": "A",
                      "mode": "none"
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 80
                      }
                    ]
                  },
                  "unit": "celsius"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 18,
                "x": 6,
                "y": 0
              },
              "id": 2,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                }
              },
              "pluginVersion": "10.0.0",
              "targets": [
                {
                  "datasource": {
                    "type": "influxdb",
                    "uid": "P1809F7CD0C757532"
                  },
                  "query": "from(bucket: \"$${bucket}\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r[\"_measurement\"] == \"mqtt_consumer\")\n  |> filter(fn: (r) => r[\"_field\"] == \"temperature\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> yield(name: \"mean\")",
                  "refId": "A"
                }
              ],
              "title": "Temperature History",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "influxdb",
                "uid": "P1809F7CD0C757532"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "custom": {
                    "fillOpacity": 70,
                    "lineWidth": 0,
                    "spanNulls": false
                  },
                  "mappings": [
                    {
                      "options": {
                        "0": {
                          "color": "blue",
                          "index": 1,
                          "text": "OFF"
                        },
                        "1": {
                          "color": "red",
                          "index": 0,
                          "text": "ON"
                        }
                      },
                      "type": "value"
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "h": 6,
                "w": 24,
                "x": 0,
                "y": 8
              },
              "id": 3,
              "options": {
                "alignValue": "left",
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "mergeValues": true,
                "rowHeight": 0.9,
                "showValue": "auto",
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                }
              },
              "pluginVersion": "10.0.0",
              "targets": [
                {
                  "datasource": {
                    "type": "influxdb",
                    "uid": "P1809F7CD0C757532"
                  },
                  "query": "from(bucket: \"$${bucket}\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r[\"_measurement\"] == \"mqtt_consumer\")\n  |> filter(fn: (r) => r[\"_field\"] == \"heater\")\n  |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)\n  |> yield(name: \"last\")",
                  "refId": "A"
                }
              ],
              "title": "Heater Status",
              "type": "state-timeline"
            }
          ],
          "refresh": "5s",
          "schemaVersion": 38,
          "style": "dark",
          "tags": [],
          "templating": {
            "list": [
              {
                "current": {
                  "selected": true,
                  "text": "sensors",
                  "value": "sensors"
                },
                "hide": 2,
                "name": "bucket",
                "options": [
                  {
                    "selected": true,
                    "text": "sensors",
                    "value": "sensors"
                  }
                ],
                "query": "sensors",
                "skipUrlSync": false,
                "type": "constant"
              }
            ]
          },
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "timepicker": {},
          "timezone": "browser",
          "title": "Temperature Monitor",
          "uid": "fdg5567gh",
          "version": 1,
          "weekStart": ""
        }
        EOF

        exec /run.sh
    env_file:
      - stack.env
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - ALERT_THRESHOLD_TEMP=${ALERT_THRESHOLD_TEMP}

networks:
  backend-net:
    driver: bridge

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
